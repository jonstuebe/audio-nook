<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Audio Nook's icon: a shelf of spines standing like an equalizer, on the Mac's icon grid
       (an 824 pt rounded square at 100, with its shadow). Render with tools/app-icon.sh. -->
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6a5e"/>
      <stop offset="1" stop-color="#103a33"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <g clip-path="url(#sq)">
    <rect x="232" y="470" width="80" height="290" rx="14" fill="#f6e7c8"/>
    <rect x="328" y="350" width="80" height="410" rx="14" fill="#ff8a6b"/>
    <rect x="424" y="510" width="80" height="250" rx="14" fill="#ffcf5a"/>
    <rect x="520" y="290" width="80" height="470" rx="14" fill="#8fe0c8"/>
    <rect x="616" y="420" width="80" height="340" rx="14" fill="#f4a7c0"/>
    <rect x="712" y="540" width="80" height="220" rx="14" fill="#9cc8ff"/>
    <g fill="#000" opacity="0.14">
      <rect x="232" y="510" width="80" height="14"/>
      <rect x="328" y="390" width="80" height="14"/>
      <rect x="424" y="550" width="80" height="14"/>
      <rect x="520" y="330" width="80" height="14"/>
      <rect x="616" y="460" width="80" height="14"/>
      <rect x="712" y="580" width="80" height="14"/>
    </g>
    <rect x="200" y="760" width="624" height="30" rx="15" fill="#0a2622"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
  </g>
</svg>
